<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack Evans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
<style>
:root {
  --paper:  #F2EEE1;
  --yellow: #FFE000;
  --ink:    #111111;
  --muted:  #666;
  /* Shown only for a moment while a photo loads, so they sit close to the photos' own tones. */
  --geo-bg:     #8C7F68;
  --tech-bg:    #14201A;
  --culture-bg: #24201D;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; height: 100%; }

body {
  background: var(--yellow);
  font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
}

/* ---- STAGE ---- */
.page {
  position: fixed;
  inset: 0;
  background: var(--yellow);
  overflow: hidden;
}

/* ---- MASTHEAD ---- */
#home-view {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-bottom: 31px; /* room for the fixed footer */
  background: var(--yellow);
}
#subj-boxes {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.mast {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 20px 36px 12px;
  background: var(--yellow);
}

.mast-name {
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-weight: 900;
  font-size: 28px;
  letter-spacing: 1.5px;
  text-transform: lowercase;
  color: var(--ink);
}

/* ---- HOME: SUBJECT BOXES ---- */
.subj-box {
  width: 100%;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  padding: clamp(14px, 2.6vh, 28px) 36px clamp(12px, 2.2vh, 24px);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: filter 0.15s;
}
.subj-box:hover { filter: brightness(0.96); }
/* Opening/closing: a copy of the box (picture band over paper) changes size between the
   home box and the subject page, and the title flies between its two positions. */
.box-clone {
  position: absolute;
  z-index: 19;
  overflow: hidden;
  pointer-events: none;
  background: var(--paper);
}
.clone-band {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 100%;
  overflow: hidden;
}
.clone-band > * { position: absolute; inset: 0; }
.clone-home { border-top: 0 !important; cursor: default; transition: none; }
.clone-home .box-title { visibility: hidden; }
.title-fly {
  position: absolute;
  z-index: 21;
  margin: 0;
  white-space: nowrap;
  pointer-events: none;
  will-change: transform;
}
.subj-box + .subj-box { border-top: 4px solid var(--yellow); }

.box-kicker {
  font-size: 8.5px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.box-title {
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-weight: 900;
  font-size: clamp(48px, min(17vw, 14vh), 220px);
  line-height: 0.88;
  letter-spacing: -2px;
  text-transform: uppercase;
  flex-grow: 1;
  display: flex;
  align-items: flex-end;
}

.box-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid;
}

.box-cats {
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}


/* Colour themes */
.box--yellow {
  background:
    linear-gradient(rgba(35,22,8,0.45), rgba(35,22,8,0.45)),
    url(images/geography-world-map.jpg) center / cover,
    var(--geo-bg);
  color: white;
}
.box--yellow .box-kicker   { color: rgba(255,255,255,0.6); }
.box--yellow .box-footer   { border-color: rgba(255,255,255,0.25); }
.box--yellow .box-cats     { color: rgba(255,255,255,0.65); }

.box--red {
  background:
    linear-gradient(rgba(8,16,10,0.5), rgba(8,16,10,0.5)),
    url(images/technology-board.jpg) center bottom / cover,
    var(--tech-bg);
  color: white;
}
.box--red .box-kicker      { color: rgba(255,255,255,0.5); }
.box--red .box-footer      { border-color: rgba(255,255,255,0.2); }
.box--red .box-cats        { color: rgba(255,255,255,0.55); }

.box--blue {
  background:
    linear-gradient(rgba(10,10,10,0.5), rgba(10,10,10,0.5)),
    url(images/culture.jpg) center / cover,
    var(--culture-bg);
  color: white;
}
.box--blue .box-kicker     { color: rgba(255,255,255,0.5); }
.box--blue .box-footer     { border-color: rgba(255,255,255,0.2); }
.box--blue .box-cats       { color: rgba(255,255,255,0.55); }

/* ---- PAGE FOOTER ---- */
.page-foot {
  position: absolute;
  bottom: 0;
  left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  font-size: 8.5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(17,17,17,0.5);
  background: var(--yellow);
  padding: 10px 36px;
}

/* ---- SUBJECT OVERLAY ---- */
#subj-overlay {
  position: absolute;
  display: none;
  z-index: 20;
  overflow: hidden;
}

.subj-view {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* Subject header (coloured area) */
.subj-hdr {
  position: relative;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 26px 48px 28px;
}
/* Extra height (see sizeSubjectHeader) opens up between "back" and the title. */
.subj-hdr .subj-back { align-self: flex-start; margin-bottom: auto; }
.subj-hdr .subj-name { margin-top: 14px; }

/* The picture sits on its own layer so a filter can tint it without touching the text. */
.subj-hdr-bg { position: absolute; inset: 0; z-index: 0; }
.subj-hdr > :not(.subj-hdr-bg) { position: relative; z-index: 1; }

.subj-back {
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
  transition: opacity 0.15s;
}
.subj-back:hover { opacity: 0.7; }

.subj-name {
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-weight: 900;
  font-size: clamp(56px, 9vw, 140px);
  line-height: 0.9;
  letter-spacing: -1px;
  text-transform: uppercase;
  margin-bottom: 22px;
}

.subj-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.subj-tab {
  font-size: 13px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  padding: 8px 16px;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.15s;
  font-family: 'Barlow', Arial, sans-serif;
}

/* Yellow header */
.hdr--yellow .subj-back { color: var(--ink); }
.hdr--yellow .subj-name { color: var(--ink); }
.hdr--yellow .subj-tab  { border-color: rgba(17,17,17,0.35); color: rgba(17,17,17,0.7); background: rgba(242,238,225,0.8); }
.hdr--yellow .subj-tab.active { background: var(--ink); border-color: var(--ink); color: white; }
.hdr--yellow .subj-tab:hover:not(.active) { border-color: rgba(17,17,17,0.6); color: var(--ink); }

/* Red header */
.hdr--red .subj-back { color: white; }
.hdr--red .subj-name { color: white; }
.hdr--red .subj-tab  { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.6); }
.hdr--red .subj-tab.active { background: white; border-color: white; color: var(--ink); }
.hdr--red .subj-tab:hover:not(.active) { border-color: white; color: white; }

.hdr--blue .subj-back { color: white; }
.hdr--blue .subj-name { color: white; }

/* Subject content (paper area) */
.subj-content {
  flex: 1;
  background: var(--paper);
  overflow-y: auto;
  padding: 36px 48px 80px;
}

.subj-desc {
  font-family: 'Times New Roman', Times, serif;
  font-size: 19px;
  line-height: 1.6;
  color: #2a2a2a;
  max-width: 820px;
  margin-bottom: 28px;
  padding-bottom: 22px;
  border-bottom: 1px solid rgba(17,17,17,0.12);
}

/* Category section heading */
.cat-label {
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 18px;
}

/* ---- EXAMPLE CARDS ---- */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr));
  gap: 36px 28px;
  transition: opacity 0.15s;
}

.card {
  display: flex;
  flex-direction: column;
}

.card-img {
  background: #CBC6B5;
  aspect-ratio: 16 / 10;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #AAA494;
  margin-bottom: 12px;
  text-align: center;
  padding: 8px;
  line-height: 1.4;
}

.card-title {
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-weight: 700;
  font-size: 28px;
  text-transform: uppercase;
  color: var(--ink);
  line-height: 1.05;
  margin-bottom: 8px;
}

.card-desc {
  font-family: 'Times New Roman', Times, serif;
  font-size: 17px;
  line-height: 1.5;
  color: #3a3a3a;
  flex-grow: 1;
}

.card-coords {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin-top: 8px;
  font-family: 'Barlow', Arial, sans-serif;
}

.img-buttons {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 32px;
}
.img-btn {
  width: clamp(160px, 26vw, 280px);
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  transition: transform 0.2s ease;
}
.img-btn img {
  display: block;
  width: 100%;
  height: auto;
  /* Light from the upper right: a soft shadow to the left and below gives the pale left side some depth. */
  filter: drop-shadow(-5px 3px 4px rgba(0,0,0,0.24)) drop-shadow(-10px 10px 16px rgba(0,0,0,0.24));
}
.img-btn:hover { transform: translateY(-4px) scale(1.03); }
.img-btn:active { transform: translateY(-1px) scale(1.01); }
.img-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }

/* The TV pop-up: the cut-out grows from its button to fill most of the screen.
   .tv-screen sits exactly over the TV's glass and is where its content will go. */
#tv-pop {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: none;
}
#tv-pop.open { display: block; }
.tv-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(17,17,17,0.72);
}
.tv-frame {
  position: absolute;
  transform-origin: 0 0;
  will-change: transform;
}
.tv-frame img {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
}
.tv-screen {
  position: absolute;
  overflow: hidden;
  border-radius: 3.4% / 4.5%;   /* the glass's rounded corners */
  container-type: size;         /* lets what's inside size itself to the screen (cqw / cqh) */
}
/* Black screen behind the picture (dark glass while the picture switches on and off). */
.tv-black {
  position: absolute;
  inset: 0;
  background: #0c0e0d;
  opacity: 0;
}
/* What's showing on the TV. The page is laid out in HTML (.tv-page-src: positions come from the CSS
   below) but kept invisible; it's copied into an image and drawn bent like curved glass on .tv-gl
   (see makeCrt). The invisible page is still read out by screen readers. */
.tv-content {
  position: absolute;
  inset: 0;
  opacity: 0;                   /* off until the TV has finished growing */
}
.tv-page-src {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}
.tv-gl {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
/* The glass in front of the picture: it makes flat content read as a curved CRT.
   Edge shadow (the surround overhangs the glass), vignette (bulge), scanlines and a reflection. */
.tv-glass {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  opacity: 0;
  background:
    linear-gradient(155deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.04) 26%, transparent 42%),
    radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(0,0,0,0.38) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.08) 0 1px, transparent 1px 3px);
  box-shadow:
    inset 0 0 2.2cqw 0.6cqw rgba(0,0,0,0.6),
    inset 0 0 7cqw rgba(0,0,0,0.25);
}
/* A faint brighter band that slowly rolls down the picture. */
.tv-glass::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 18%;
  top: -18%;
  background: linear-gradient(transparent, rgba(255,255,255,0.035), transparent);
  animation: tv-roll 7s linear infinite;
}
@keyframes tv-roll { to { top: 100%; } }
@media (prefers-reduced-motion: reduce) { .tv-glass::after { animation: none; display: none; } }

/* One TV show per page (data in shows.json). Sizes are in cqw/cqh, i.e. relative to the screen,
   so the page scales with the TV. Screenshot top-left, description top-right, title, then cast
   bottom-left and network bottom-right. */
.show-page {
  position: absolute;
  inset: 0;
  background: #fbfaf6;
  color: #1b1b1b;
  padding: 6cqh 6cqw 7cqh;
  display: grid;
  grid-template-columns: 62% 1fr;
  grid-template-rows: auto auto 1fr;
  grid-template-areas:
    "still desc"
    "title  ."
    "bottom bottom";
  column-gap: 4cqw;
}
.show-still {
  grid-area: still;
  aspect-ratio: 16 / 9;
  width: 100%;
  /* Rounded, with a thin dark bezel and a soft shadow to set it apart from the page. */
  border-radius: 1.4cqw;
  overflow: hidden;
  border: 0.45cqw solid #2b2a28;
  box-shadow: 0 0.4cqw 1.2cqw rgba(0,0,0,0.22);
}
.show-desc {
  grid-area: desc;
  font-family: 'Barlow', Arial, sans-serif;
  font-size: 2.9cqw;
  line-height: 1.35;
  color: #222;
}
.show-title {
  grid-area: title;
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-weight: 900;
  font-size: 9.5cqw;
  line-height: 0.74;            /* about the capitals' height, so equal margins centre the letters */
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 2.75cqh 0 4.45cqh 1.8cqw;   /* puts the letters midway between screenshot and cast; the left margin indents it */
  white-space: nowrap;
}
/* Bottom row: the cast photos, then the network logo centred in the space between the last
   photo and the edge of the screen (slightly right of centre). */
.show-bottom {
  grid-area: bottom;
  display: flex;
  min-height: 0;
  margin-right: -6cqw;          /* reach the screen's edge, past the page's padding */
}
.show-cast {
  flex: none;
  display: flex;
  gap: 3cqw;
  min-height: 0;
}
.show-cast > * {
  height: 100%;
  aspect-ratio: 4 / 5;
}
.show-network {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 0;              /* centred between the last cast photo and the screen's edge */
}
.show-page img { display: block; width: 100%; height: 100%; object-fit: cover; }
.show-page .net-logo { width: auto; height: auto; max-width: 30cqw; max-height: 18cqh; object-fit: contain; }
.show-ph {     /* grey box where a picture hasn't been added yet */
  background: #d9d5cb;
}

/* Networks are drawn as type rather than logo images. */
.net-bbc { display: flex; flex-direction: column; align-items: center; gap: 0.8cqh; }
.net-bbc-blocks { display: flex; gap: 0.7cqw; }
.net-bbc-blocks span {
  width: 3.6cqw; height: 3.6cqw;
  display: grid; place-items: center;
  font-family: 'Barlow', Arial, sans-serif; font-weight: 700; font-size: 2.7cqw; line-height: 1;
  color: #fff;
}
.net-bbc-channel, .net-plain {
  font-family: 'Barlow', Arial, sans-serif;
  font-weight: 700;
  font-size: 7cqw;
  line-height: 0.9;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.net-plain { font-size: 4cqw; color: #555; }

.tv-nosignal {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-family: 'Barlow Condensed', Impact, sans-serif; font-weight: 700; font-size: 6cqw;
  letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.7);
}


/* Channel buttons: the "1" and "12" windows on the TV's front glow orange; 1 goes back, 12 forwards. */
.tv-frame { container-type: inline-size; }
.tv-ch {
  position: absolute;
  padding: 0;
  border: 0;
  border-radius: 0.6cqw;
  background: radial-gradient(ellipse at 50% 55%, rgba(255,140,30,0.32), rgba(255,140,30,0.08) 70%, transparent);
  box-shadow: 0 0 1.2cqw rgba(255,140,30,0.45), inset 0 0 0.8cqw rgba(255,150,40,0.35);
  cursor: pointer;
  transition: box-shadow 0.15s, background 0.15s;
}
.tv-ch::before {     /* the indicator light at the top of the window */
  content: '';
  position: absolute;
  left: 50%;
  top: 9%;
  width: 1.15cqw;
  height: 1.15cqw;
  border-radius: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle at 40% 35%, #ffe2b0, #ff9a1f 55%, #d45a00);
  box-shadow: 0 0 0.6cqw 0.2cqw rgba(255,150,30,0.9), 0 0 2cqw 0.6cqw rgba(255,120,20,0.45);
  animation: tv-ch-glow 2.4s ease-in-out infinite;
}
@keyframes tv-ch-glow { 50% { filter: brightness(1.25); } }
.tv-ch:hover {
  background: radial-gradient(ellipse at 50% 55%, rgba(255,150,40,0.5), rgba(255,140,30,0.15) 70%, transparent);
  box-shadow: 0 0 2cqw rgba(255,140,30,0.7), inset 0 0 1cqw rgba(255,160,50,0.5);
}
.tv-ch:active::before { filter: brightness(1.6); }
.tv-ch:focus-visible { outline: 2px solid #ffb35c; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .tv-ch::before { animation: none; } }
.tv-close {
  position: absolute;
  top: 18px;
  right: 24px;
  font-size: 11px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  background: none;
  border: 0;
  padding: 6px 0 6px 12px;
  cursor: pointer;
  font-family: 'Barlow', Arial, sans-serif;
}
.tv-close:hover { color: white; }

.coming-soon {
  grid-column: 1 / -1;
  min-height: 55vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', Impact, sans-serif;
  font-weight: 900;
  font-size: clamp(56px, 8vw, 120px);
  letter-spacing: -0.5px;
  text-transform: uppercase;
  color: rgba(17,17,17,0.18);
}

.card--open { cursor: pointer; }
.card--open .card-img { position: relative; transition: filter 0.15s; }
.card--open:hover .card-img { filter: brightness(0.93); }
.card--open:hover .card-title { text-decoration: underline; }

.card-img--thumb {
  padding: 0;
  align-items: stretch;
  gap: 2px;
  background: white;
}
.thumb-half {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--ink);
}
.thumb-half img {
  position: absolute;
  width: 256px; height: 256px;
  max-width: none;
}
.thumb-half--photo img {
  position: static;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

.card-open-tag {
  position: absolute;
  left: 0; bottom: 0;
  background: var(--ink);
  color: white;
  font-size: 11px;
  letter-spacing: 1.5px;
  padding: 7px 10px;
}

/* ---- BEFORE / AFTER POP-UP ---- */
#cmp-pop {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(17,17,17,0.72);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
#cmp-pop.open { opacity: 1; pointer-events: auto; }

.cmp-panel {
  width: min(1280px, calc(100vw - 64px));
  max-height: calc(100% - 48px);
  display: flex;
  flex-direction: column;
  background: var(--paper);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  transform: translateY(14px);
  transition: transform 0.25s ease;
}
#cmp-pop.open .cmp-panel { transform: none; }

.cmp-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 16px 20px 14px;
  background: var(--yellow);
  color: var(--ink);
}

.cmp-kicker {
  font-size: 8.5px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  opacity: 0.6;
  margin-bottom: 6px;
}

.cmp-title {

.cmp-stage {

  touch-action: none;
  outline: none;

.cmp-layer { position: absolute; inset: 0; }
.cmp-layer--before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
.cmp-layer img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

.cmp-tag {
  position: absolute;
  top: 12px;

  color: white;
  font-size: 8.5px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  padding: 5px 9px;

.cmp-tag--before { left: 12px; }

.cmp-bar {
  position: absolute;
  top: 0; bottom: 0;
  left: var(--pos);
  width: 2px;
  margin-left: -1px;
  background: white;
}

.cmp-knob {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 38px; height: 38px;
  background: var(--yellow);
  border: 2px solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--ink);
  white-space: nowrap;
}
.cmp-bar { outline: none; }
.cmp-bar:focus-visible .cmp-knob { outline: 2px solid white; outline-offset: 2px; }

/* Zoomable map version */

.cmp-map {

  inset: 0;

<script>
/* ===================== DATA ===================== */

const subjects = {
  geography: {
    id: 'geography',
    label: 'Geography',
    kicker: '',
    colorClass: 'box--yellow',
    hdrClass: 'hdr--yellow',
    bgColor: '#8C7F68',
    bgImage: 'images/geography-world-map.jpg',
    bgWash: 'rgba(240,226,192,0.35)',
    // Header picture per tab; tabs not listed show the subject's own (the map).
    catBackgrounds: {
      destruction: { src: 'images/geography-destruction.jpg', position: 'center 30%', wash: 'rgba(240,226,192,0.45)', filter: 'contrast(1.15)' },
      creation:    { src: 'images/geography-creation.jpg',    position: 'center 70%', wash: 'rgba(240,226,192,0.25)' },
      nature:      { src: 'images/geography-nature-stop.jpg', position: 'center 40%', wash: 'rgba(240,226,192,0.3)', filter: 'sepia(0.35)' },
      event:       { src: 'images/geography-event.jpg',      position: 'center 45%', wash: 'rgba(240,226,192,0.5)' }
    },
    desc: '',
    categories: ['Destruction', 'Creation', 'Nature', 'Event'],
    defaultCat: 'destruction',
    examples: {
      destruction: [
        { title: 'Rafah, Gaza',         desc: 'Near-total destruction of a dense urban area following military operations, 2023–24.',    coords: '31.3° N, 34.3° E',
          // release = Esri World Imagery Wayback release number; labels are the imagery capture dates at the map centre.
          compare: {
            map:    { center: [31.2874, 34.2520], zoom: 16 },
            before: { label: 'Before · May 2022', release: 45134 },
            after:  { label: 'After · Jan 2025',  release: 43291 }
          } },
        { title: 'Marinka, Ukraine',    desc: 'Frontline town west of Donetsk, fought over from 2014 and reduced to ruins by the end of 2023.', coords: '47.9° N, 37.5° E',
          compare: {
            // bounds keep the view on the town; the 2021 imagery stops at zoom 17.
            map:    { center: [47.9421, 37.5034], zoom: 16, minZoom: 14, maxZoom: 17,
                      bounds: [[47.920, 37.465], [47.965, 37.545]] },
            before: { label: 'Before · Oct 2021', release: 48232 },
            after:  { label: 'After · Sep 2024',  release: 43291 }
          } },
      ],
      creation: [
        { title: 'Milton Keynes, UK',    desc: 'New town planned and built on agricultural land from 1967, following a strict grid.',    coords: '52.0° N, 0.7° W',
          // Static screenshots: both are the same view, so cropping them identically keeps them aligned.
          compare: {
            aspect: 1.9,
            focus:  '46% 45%',
            credit: 'Imagery: Google Earth',
            before: { label: 'Before · 1945', src: 'images/milton-keynes-1945.webp' },
            after:  { label: 'After · today', src: 'images/milton-keynes-today.webp' }
          } },
        { title: 'Palm Jumeirah, Dubai', desc: 'Artificial archipelago constructed from 94 million cubic metres of reclaimed sea.',       coords: '25.1° N, 55.1° E',
          // Release 10 at zoom 13 and below predates the Palm (no Palm or World islands visible,
          // despite Esri's metadata saying 2010); from zoom 14 it switches to 2011 imagery with the Palm built.
          compare: {
            // The after imagery is Nov 2025 only at zoom 12+; wider levels use an undated Earthstar mosaic.
            map:    { center: [25.124, 55.120], zoom: 11, minZoom: 9, maxZoom: 13 },
            before: { label: 'Before · pre-2001', release: 10 },
            after:  { label: 'After · 2020s', release: 43291 }
          } },
      ],
      nature: [],
      event: [
        { title: 'Inauguration Day, Washington DC', desc: 'Crowds fill the National Mall around the Washington Monument for Barack Obama’s first inauguration, 20 January 2009 — against an ordinary winter’s day.', coords: '38.9° N, 77.0° W',
          // Google Earth screenshots, aligned by hand and cropped to the same 1137×625 area.
          compare: {
            aspect: 1.82,
            credit: 'Imagery: Google Earth',
            before: { label: 'Inauguration · 20 Jan 2009', src: 'images/washington-2009-inauguration.webp' },
            after:  { label: 'Ordinary day', src: 'images/washington-ordinary-day.webp' }
          } }
      ]
    }
  },
  technology: {
    id: 'technology',
    label: 'Technology',
    kicker: '',
    colorClass: 'box--red',
    hdrClass: 'hdr--red',
    bgColor: '#14201A',
    bgImage: 'images/technology-board.jpg',
    bgWash: 'rgba(8,16,10,0.5)',
    bgPosition: 'center bottom',
    desc: '',
    categories: [],
    defaultCat: null,
    examples: {}
  }
};

subjects.culture = {
  id: 'culture',
  label: 'Culture',
  kicker: '',
  colorClass: 'box--blue',
  hdrClass: 'hdr--blue',
  bgColor: '#24201D',
  bgImage: 'images/culture.jpg',
  bgWash: 'rgba(10,10,10,0.5)',
  desc: '',
  categories: [],
  defaultCat: null,
  examples: {},
  // screen = where the TV's glass sits in the picture, as fractions of its width and height;
  // clicking the button grows it into a pop-up showing the TV shows from shows.json.
  // prev / next = the "1" and "12" channel windows on the front, which change show.
  buttons: [
    { id: 'tv', label: 'TV', img: 'images/culture-tv.webp',
      screen: { left: 0.131, top: 0.119, width: 0.744, height: 0.575 },
      prev:   { left: 0.315, top: 0.7625, width: 0.0335, height: 0.0395 },
      next:   { left: 0.6945, top: 0.7625, width: 0.0345, height: 0.0395 } }
  ]
};

const subjectOrder = ['geography', 'technology', 'culture'];

/* ===================== HOME VIEW ===================== */

function renderHome() {
  const container = document.getElementById('subj-boxes');
  container.innerHTML = subjectOrder.map(id => {
    const s = subjects[id];
    return `
    <div class="subj-box ${s.colorClass}" data-subject="${id}">
      <div>
        ${s.kicker ? `<div class="box-kicker">${s.kicker}</div>` : ''}
        <div class="box-title">${s.label}</div>
      </div>
      <div class="box-footer">
        <div class="box-cats">${s.categories.length ? '' : 'coming soon'}</div>
      </div>
    </div>`;
  }).join('');

  container.querySelectorAll('.subj-box').forEach(box => {
    box.addEventListener('click', () => openSubject(box.dataset.subject, box));
  });
}

/* ===================== SUBJECT VIEW ===================== */

let currentCat     = null;
let currentSubjId  = null;
let isSubjectOpen  = false;
let overlayAnims   = [];

const EXPAND_MS = 520;
const SHRINK_MS = 440;
const FADE_MS   = 220;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

// Opening grows a solid copy of the clicked box to full screen, then fades the subject
// page in over it; closing reverses that. animToken lets a newer click abandon an
// older sequence part-way.
let boxClone  = null;
let animToken = 0;

function boxRect(boxEl) {
  const r  = getBoxPos(boxEl);
  const bt = parseFloat(getComputedStyle(boxEl).borderTopWidth) || 0;
  return { top: r.top + bt, left: r.left, width: r.width, height: r.height - bt };
}
function fullRect() {
  const p = document.getElementById('page').getBoundingClientRect();
  return { top: 0, left: 0, width: p.width, height: p.height };
}
function rectFrame(r) {
  return { top: r.top + 'px', left: r.left + 'px', width: r.width + 'px', height: r.height + 'px' };
}

let titleFly = null;

function pageOffset() {
  return document.getElementById('page').getBoundingClientRect();
}
// Where an element's text is drawn (page-relative), transforms included.
function textRect(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const b = range.getBoundingClientRect(), p = pageOffset();
  return { left: b.left - p.left, top: b.top - p.top, width: b.width, height: b.height };
}
// Font size and letter-spacing as they look on screen (a transform's scale included).
function titleState(el) {
  const cs = getComputedStyle(el);
  const k  = cs.transform && cs.transform !== 'none' ? new DOMMatrix(cs.transform).a : 1;
  return { r: textRect(el), fs: parseFloat(cs.fontSize) * k, ls: (parseFloat(cs.letterSpacing) || 0) * k, color: cs.color };
}

// The copy is a picture band over paper. The band holds the home box's picture with the
// page's header picture on top: the band shrinks or grows to the header's height while the
// two pictures cross-fade directly into each other.
function makeBoxClone(boxEl, s, cat) {
  removeBoxClone();
  const c = document.createElement('div');
  c.className = 'box-clone';
  c.innerHTML = `<div class="clone-band"><div class="clone-hdr" style="background:${headerBg(s, cat)}; filter:${headerFilter(s, cat)};"></div></div>`;
  const home = boxEl.cloneNode(true);
  home.removeAttribute('data-subject');
  home.classList.add('clone-home');
  c.firstChild.prepend(home);
  document.getElementById('page').appendChild(c);
  boxClone = c;
  return c;
}

// A copy of the page title, laid out exactly where the real one sits (base), then moved and
// scaled with a transform so it can sit over the home box's title too.
function makeTitleFly(s, base) {
  const t = document.createElement('div');
  t.className = 'subj-name title-fly';
  t.textContent = s.label;
  t.style.left = '0px';
  t.style.top  = '0px';
  document.getElementById('page').appendChild(t);
  const m = textRect(t), p = pageOffset(), e = t.getBoundingClientRect();
  t.style.left = (base.left - m.left) + 'px';
  t.style.top  = (base.top  - m.top)  + 'px';
  t.style.transformOrigin = `${m.left - (e.left - p.left)}px ${m.top - (e.top - p.top)}px`;
  t._base = base;
  titleFly = t;
  return t;
}
function flyFrame(title) {
  const base = titleFly._base;
  const k = title.fs / parseFloat(getComputedStyle(titleFly).fontSize);
  return {
    transform: `translate(${title.r.left - base.left}px, ${title.r.top - base.top}px) scale(${k})`,
    letterSpacing: (title.ls / k) + 'px',
    color: title.color
  };
}

// The two ends of the transition, and wherever a running one has got to.
function homeState(boxEl) {
  const r = boxRect(boxEl);
  return { rect: r, band: r.height, hdr: 0, foot: 1, title: titleState(boxEl.querySelector('.box-title')) };
}
function pageState() {
  return { rect: fullRect(), band: subjectHeaderHeight(), hdr: 1, foot: 0,
           title: titleState(document.querySelector('#subj-overlay .subj-name')) };
}
function liveState() {
  if (!boxClone || !titleFly) return null;
  const p = pageOffset(), c = boxClone.getBoundingClientRect();
  return {
    rect: { top: c.top - p.top, left: c.left - p.left, width: c.width, height: c.height },
    band: boxClone.querySelector('.clone-band').getBoundingClientRect().height,
    hdr:  +getComputedStyle(boxClone.querySelector('.clone-hdr')).opacity,
    foot: +getComputedStyle(boxClone.querySelector('.box-footer')).opacity,
    title: titleState(titleFly)
  };
}

function animateClone(from, to, duration, easing) {
  const opts = { duration, easing, fill: 'forwards' };
  const fade = { duration, fill: 'forwards' };
  const growing = to.hdr > from.hdr;
  return [
    boxClone.animate([rectFrame(from.rect), rectFrame(to.rect)], opts),
    boxClone.querySelector('.clone-band').animate([{ height: from.band + 'px' }, { height: to.band + 'px' }], opts),
    boxClone.querySelector('.clone-hdr').animate(growing
      ? [{ opacity: from.hdr }, { opacity: from.hdr, offset: 0.04 }, { opacity: to.hdr, offset: 0.6 }, { opacity: to.hdr }]
      : [{ opacity: from.hdr }, { opacity: from.hdr, offset: 0.15 }, { opacity: to.hdr, offset: 0.85 }, { opacity: to.hdr }], fade),
    boxClone.querySelector('.box-footer').animate(growing
      ? [{ opacity: from.foot }, { opacity: to.foot, offset: 0.2 }, { opacity: to.foot }]
      : [{ opacity: from.foot }, { opacity: from.foot, offset: 0.75 }, { opacity: to.foot }], fade),
    titleFly.animate([flyFrame(from.title), flyFrame(to.title)], opts)
  ];
}

function subjectHeaderHeight() {
  const hdr = document.querySelector('#subj-overlay .subj-hdr');
  return hdr ? hdr.getBoundingClientRect().height : 0;
}
function removeBoxClone() {
  if (boxClone) { boxClone.remove(); boxClone = null; }
  if (titleFly) { titleFly.remove(); titleFly = null; }
}

// The header is 50% taller than its content needs; its natural height varies with screen width.
function sizeSubjectHeader() {
  const hdr = document.querySelector('#subj-overlay .subj-hdr');
  if (!hdr) return;
  hdr.style.minHeight = '';
  hdr.style.minHeight = Math.round(hdr.getBoundingClientRect().height * 1.5) + 'px';
}

function stopOverlayAnims() {
  overlayAnims.forEach(a => a.cancel());
  overlayAnims = [];
}

function openSubject(subjId, boxEl) {
  const token = ++animToken;
  // Re-opening while the close is still running carries on from where it has got to.
  const live = currentSubjId === subjId ? liveState() : null;
  currentSubjId = subjId;
  isSubjectOpen = true;
  const s = subjects[subjId];
  currentCat = s.defaultCat;

  stopOverlayAnims();
  const overlay = document.getElementById('subj-overlay');
  overlay.style.cssText = `display: block; inset: 0; background: ${subjectBg(s)}; opacity: 0; pointer-events: none;`;
  overlay.innerHTML = buildSubjectHTML(s, currentCat);
  sizeSubjectHeader();
  overlay.addEventListener('click', onOverlayClick);
  const name = overlay.querySelector('.subj-name');
  name.style.visibility = 'hidden';

  const quick = reduceMotion.matches;
  const to    = pageState();
  const from  = live || homeState(boxEl);
  makeBoxClone(boxEl, s, currentCat);
  makeTitleFly(s, to.title.r);
  overlayAnims = animateClone(from, to, quick ? 0 : EXPAND_MS, 'cubic-bezier(0.22, 1, 0.36, 1)');

  // By now the copy looks exactly like the empty page, so fading the page in only adds
  // the back link, tabs and cards. The flying title stays on top until it's done.
  overlayAnims[0].finished.then(() => {
    if (token !== animToken) return;
    overlay.style.pointerEvents = '';
    const fade = overlay.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: quick ? 0 : FADE_MS, easing: 'ease-out', fill: 'forwards' });
    overlayAnims.push(fade);
    return fade.finished;
  }).then(() => {
    if (token !== animToken) return;
    overlay.style.opacity = '1';
    name.style.visibility = '';
    stopOverlayAnims();
    removeBoxClone();
  }).catch(() => {});
}

// The wash keeps header text legible over the picture: light under dark text, dark under white.
function subjectBg(s) {
  if (!s.bgImage) return s.bgColor;
  return `linear-gradient(${s.bgWash}, ${s.bgWash}), url(${s.bgImage}) ${s.bgPosition || 'center'} / cover, ${s.bgColor}`;
}

// A tab can swap the subject's header picture for its own; others keep the subject's.
function headerBg(s, cat) {
  const b = s.catBackgrounds && s.catBackgrounds[cat];
  if (!b) return subjectBg(s);
  if (!b.src) return b.color || s.bgColor;   // a plain colour, no photo
  const wash = b.wash || s.bgWash;
  return `linear-gradient(${wash}, ${wash}), url(${b.src}) ${b.position || 'center'} / cover, ${s.bgColor}`;
}

function headerFilter(s, cat) {
  const b = s.catBackgrounds && s.catBackgrounds[cat];
  return (b && b.filter) || 'none';
}

function buildSubjectHTML(s, activeCat) {
  const tabs = s.categories.map(cat => {
    const key = cat.toLowerCase();
    return `<div class="subj-tab ${key === activeCat ? 'active' : ''}" data-cat="${key}">${cat}</div>`;
  }).join('');

  return `
  <div class="subj-view">
    <div class="subj-hdr ${s.hdrClass}">
      <div class="subj-hdr-bg" style="background:${headerBg(s, activeCat)}; filter:${headerFilter(s, activeCat)};"></div>
      <div class="subj-back" data-action="back">← back</div>
      <div class="subj-name">${s.label}</div>
      <div class="subj-tabs">${tabs}</div>
    </div>
    <div class="subj-content">
      ${s.desc ? `<p class="subj-desc">${s.desc}</p>` : ''}
      ${activeCat ? `<div class="cat-label">${activeCat}</div>` : ''}
      <div class="cards-grid" id="cards-grid">${buildCards(s, activeCat)}</div>
    </div>
  </div>`;
}

// Static satellite tiles for one half of a card thumbnail, centred on the map's start point.
function buildThumbHalf(map, release) {
  const zoom  = map.zoom - 1;
  const world = 256 * 2 ** zoom;
  const px = (map.center[1] + 180) / 360 * world;
  const py = (1 - Math.asinh(Math.tan(map.center[0] * Math.PI / 180)) / Math.PI) / 2 * world;
  const reach = 288; // covers a thumbnail half up to 576px across

  let tiles = '';
  for (let tx = Math.floor((px - reach) / 256); tx * 256 < px + reach; tx++) {
    for (let ty = Math.floor((py - reach) / 256); ty * 256 < py + reach; ty++) {
      const src = WAYBACK_TILES.replace('{release}', release).replace('{z}', zoom).replace('{y}', ty).replace('{x}', tx);
      tiles += `<img src="${src}" alt="" draggable="false" style="left:calc(50% + ${tx * 256 - px}px); top:calc(50% + ${ty * 256 - py}px);">`;
    }
  }
  return `<div class="thumb-half">${tiles}</div>`;
}

function buildCardImage(ex) {
  const tag = ex.compare ? '<div class="card-open-tag">before / after →</div>' : '';
  if (ex.compare && ex.compare.map) {
    const c = ex.compare;
    return `<div class="card-img card-img--thumb">${buildThumbHalf(c.map, c.before.release)}${buildThumbHalf(c.map, c.after.release)}${tag}</div>`;
  }
  if (ex.compare && ex.compare.before.src) {
    const c = ex.compare;
    const half = img => `<div class="thumb-half thumb-half--photo"><img src="${img.src}" alt="" draggable="false" style="object-position:${c.focus || '50% 50%'};"></div>`;
    return `<div class="card-img card-img--thumb">${half(c.before)}${half(c.after)}${tag}</div>`;
  }
  return `<div class="card-img">[ ${ex.title} ]${tag}</div>`;
}

// Cut-out pictures used as buttons (a subject without tabs can show these instead of cards).
function buildImageButtons(s) {
  return `<div class="img-buttons">${s.buttons.map(b => `
    <button type="button" class="img-btn" data-btn="${b.id}" aria-label="${b.label}">
      <img src="${b.img}" alt="" draggable="false">
    </button>`).join('')}
  </div>`;
}

/* ---- TV shows (shows.json) ---- */

// Each show's pictures live in shows/<id>/ under fixed names; network logos in shows/_networks/<network>.webp.
let tvShows    = null;   // filled from shows.json when the page loads
let tvNetworks = {};
let tvChannel  = 0;      // which show is on

function loadShows() {
  return fetch('shows.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(d => { tvShows = d.shows || []; tvNetworks = d.networks || {}; })
    .catch(() => { tvShows = []; })
    .then(() => {   // the TV was opened before the list arrived
      if (tvPop) tvSetPage(tvShows[tvChannel]);
    });
}

function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function pctBox(r) {
  return `left:${r.left*100}%; top:${r.top*100}%; width:${r.width*100}%; height:${r.height*100}%;`;
}

// A picture on a grey box: if the file isn't there yet, the picture removes itself and the grey box shows.
function showImg(src, alt, cls) {
  return `<div class="${cls} show-ph"><img src="${escapeHTML(src)}" alt="${escapeHTML(alt)}" draggable="false" onerror="this.remove()"></div>`;
}

// The network's logo file; if it's missing, its name is written out instead.
function buildNetwork(id) {
  const n = tvNetworks[id];
  if (!id) return '';
  return `<img class="net-logo" src="shows/_networks/${escapeHTML(id)}.webp" alt="${escapeHTML(n ? n.name : id)}" draggable="false"
            onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
          <div hidden>${networkInType(n || { name: id })}</div>`;
}

// BBC channels get the three blocks over the channel name; anything else is plain type.
function networkInType(n) {
  const colour = n.colour || '#111';
  const bbc = /^BBC\s+(.+)$/i.exec(n.name);
  if (bbc) {
    return `<div class="net-bbc" aria-label="${escapeHTML(n.name)}">
      <div class="net-bbc-blocks">${'BBC'.split('').map(l => `<span style="background:${colour}">${l}</span>`).join('')}</div>
      <div class="net-bbc-channel" style="color:${colour}">${escapeHTML(bbc[1])}</div>
    </div>`;
  }
  return `<div class="net-plain" style="color:${colour}">${escapeHTML(n.name)}</div>`;
}

function buildShowPage(show) {
  if (!show) return '<div class="tv-nosignal">No signal</div>';
  const dir  = `shows/${show.id}/`;
  const cast = [0, 1, 2].map(i => (show.cast || [])[i]);   // always three photos; the names are optional labels
  return `
  <div class="show-page">
    ${showImg(dir + 'still.webp', show.title + ' — still', 'show-still')}
    <p class="show-desc">${escapeHTML(show.description)}</p>
    <div class="show-title" style="color:${show.titleColour || '#1f4e79'}">${escapeHTML(show.title)}</div>
    <div class="show-bottom">
      <div class="show-cast">${cast.map((name, i) => showImg(`${dir}cast-${i + 1}.webp`, name || 'Cast member', 'show-cast-member')).join('')}</div>
      <div class="show-network">${buildNetwork(show.network)}</div>
    </div>
  </div>`;
}

// A burst of static while the channel changes; the new show appears halfway through.
let tvStaticRun = 0;
function changeChannel(step) {
  if (!tvPop || tvPop.closing || !tvShows || !tvShows.length) return;   // with one show it just re-tunes to it
  tvChannel = (tvChannel + step + tvShows.length) % tvShows.length;
  const crt = tvPop.crt;
  const run = ++tvStaticRun;
  const DURATION = reduceMotion.matches ? 0 : 260;
  let swapped = false;
  const start = performance.now();
  const frame = now => {
    if (run !== tvStaticRun || !tvPop || tvPop.crt !== crt) return;
    const t = DURATION ? (now - start) / DURATION : 1;
    if (!swapped && t >= 0.45) { tvSetPage(tvShows[tvChannel]); swapped = true; }
    if (t >= 1) { crt.setStatic(0); crt.draw(); return; }
    crt.setStatic(t < 0.45 ? 0.55 + t : 1 - (t - 0.45) / 0.55 * 0.85);
    crt.draw();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

/* ---- The CRT picture ----
   The show page is laid out in HTML (kept invisible, so the CSS still decides where everything goes),
   copied into an image (paintPage), and drawn by WebGL bent like the curved glass of a CRT (makeCrt).
   Drawing the bend ourselves keeps it smooth: the browser's own bend filter skips and doubles rows
   of pixels, which made text and edges jagged. */

const CURVE = 0.018;   // how far the middle of each edge is pulled in, as a share of half the screen (corners ≈ 2×)

// Copies the laid-out page into a canvas (backgrounds, borders, shadows, pictures and text, each where
// the CSS put it). scale = canvas pixels per CSS pixel.
function paintPage(src, scale) {
  const W = Math.round(src.offsetWidth * scale), H = Math.round(src.offsetHeight * scale);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0c0e0d';
  ctx.fillRect(0, 0, W, H);
  const page = src.firstElementChild;
  if (!page || !src.offsetWidth) return c;

  const base = src.getBoundingClientRect();
  const k = base.width / src.offsetWidth;     // the TV may be mid-animation, i.e. scaled
  const box = r => ({ x: (r.left - base.left) / k * scale, y: (r.top - base.top) / k * scale,
                      w: r.width / k * scale, h: r.height / k * scale });
  const px = v => (parseFloat(v) || 0) * scale;
  const inset = (b, d) => ({ x: b.x + d, y: b.y + d, w: b.w - 2 * d, h: b.h - 2 * d });
  const shape = (b, r) => { ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, Math.max(0, Math.min(r, b.w / 2, b.h / 2))); };
  const seen = col => col && !/rgba\(.*,\s*0\)$/.test(col) && col !== 'transparent';
  const range = document.createRange();

  const drawImage = (img, b, fit) => {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const s = fit === 'contain' ? Math.min(b.w / iw, b.h / ih) : Math.max(b.w / iw, b.h / ih);
    const dw = iw * s, dh = ih * s;
    ctx.drawImage(img, b.x + (b.w - dw) / 2, b.y + (b.h - dh) / 2, dw, dh);
  };

  // Each word is drawn where the browser placed it, so line breaks and spacing match exactly.
  const drawText = (node, cs) => {
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${px(cs.fontSize)}px ${cs.fontFamily}`;
    ctx.fillStyle = cs.color;
    ctx.letterSpacing = px(cs.letterSpacing) + 'px';
    const ascent = ctx.measureText('Hg').fontBoundingBoxAscent;
    const upper = cs.textTransform === 'uppercase';
    const words = /\S+/g;
    let m;
    while ((m = words.exec(node.textContent))) {
      range.setStart(node, m.index);
      range.setEnd(node, m.index + m[0].length);
      const r = range.getClientRects()[0];
      if (!r) continue;
      const b = box(r);
      ctx.fillText(upper ? m[0].toUpperCase() : m[0], b.x, b.y + ascent);
    }
  };

  const walk = el => {
    if (el.offsetParent === null && el !== page) return;   // hidden, or inside something hidden
    const cs = getComputedStyle(el);
    const b = box(el.getBoundingClientRect());
    const radius = px(cs.borderTopLeftRadius);
    const bw = px(cs.borderTopWidth);
    const shadow = cs.boxShadow !== 'none' && /(rgba?\([^)]*\))\s+(-?[\d.]+)px\s+(-?[\d.]+)px\s+([\d.]+)px/.exec(cs.boxShadow);
    if (shadow) {
      ctx.save();
      ctx.shadowColor = shadow[1];
      ctx.shadowOffsetX = px(shadow[2]); ctx.shadowOffsetY = px(shadow[3]); ctx.shadowBlur = px(shadow[4]);
      ctx.fillStyle = '#000';
      shape(b, radius); ctx.fill();
      ctx.restore();
    }
    if (bw > 0) { ctx.fillStyle = cs.borderTopColor; shape(b, radius); ctx.fill(); }
    const inner = inset(b, bw);
    if (seen(cs.backgroundColor)) { ctx.fillStyle = cs.backgroundColor; shape(inner, radius - bw); ctx.fill(); }
    if (el.tagName === 'IMG') {
      if (el.complete && el.naturalWidth) drawImage(el, inner, cs.objectFit);
      return;
    }
    const clip = cs.overflow === 'hidden';
    if (clip) { ctx.save(); shape(inner, radius - bw); ctx.clip(); }
    for (const n of el.childNodes) {
      if (n.nodeType === 3 && n.textContent.trim()) drawText(n, cs);
      else if (n.nodeType === 1) walk(n);
    }
    if (clip) ctx.restore();
  };
  walk(page);
  return c;
}

// Draws the page bent like curved glass. Each point on the screen shows the page at
// p · (1 + CURVE·|p|²) (p measured from the centre, -1 to 1), so things bow outwards more the further
// they are from the middle, and the corners curve away into black with soft, rounded edges.
// Static (for changing channel) is mixed in here too, so it's bent with the picture.
const CRT_FRAG = `
precision mediump float;
varying vec2 uv;
uniform sampler2D page;
uniform vec2 size;
uniform float curve, radius, grain, staticAmt, seed;
void main() {
  vec2 p = uv * 2.0 - 1.0;
  vec2 q = p * (1.0 + curve * dot(p, p));
  vec2 halfSize = size * 0.5;
  vec2 d = abs(q) * halfSize - (halfSize - radius);
  float dist = length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - radius;
  float inside = 1.0 - smoothstep(-1.0, 1.0, dist);
  vec3 col = texture2D(page, clamp(q * 0.5 + 0.5, 0.0, 1.0)).rgb;
  float n = fract(sin(dot(floor(gl_FragCoord.xy / grain) + seed, vec2(12.9898, 78.233))) * 43758.5453);
  col = mix(col, vec3(n), staticAmt);
  gl_FragColor = vec4(mix(vec3(0.047, 0.055, 0.051), col, inside), 1.0);
}`;
const CRT_VERT = `
attribute vec2 pos;
varying vec2 uv;
void main() {
  uv = vec2(pos.x * 0.5 + 0.5, 0.5 - pos.y * 0.5);
  gl_Position = vec4(pos, 0.0, 1.0);
}`;

function makeCrt(canvas, screen) {
  const scale = window.devicePixelRatio || 1;
  const W = Math.round(screen.offsetWidth * scale), H = Math.round(screen.offsetHeight * scale);
  canvas.width = W; canvas.height = H;
  const gl = canvas.getContext('webgl', { alpha: false, antialias: false });
  if (!gl) {   // no WebGL: show the page flat
    const ctx = canvas.getContext('2d');
    let page = null;
    return { scale, setPage(p) { page = p; }, setStatic() {}, draw() { if (page) ctx.drawImage(page, 0, 0, W, H); }, destroy() {} };
  }
  const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, CRT_VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, CRT_FRAG));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const posLoc = gl.getAttribLocation(prog, 'pos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const u = name => gl.getUniformLocation(prog, name);
  gl.uniform2f(u('size'), W, H);
  gl.uniform1f(u('curve'), CURVE);
  gl.uniform1f(u('radius'), Math.min(W, H) * 0.045);   // corner rounding
  gl.uniform1f(u('grain'), 2 * scale);                  // static speckle size
  gl.uniform1f(u('staticAmt'), 0);
  gl.viewport(0, 0, W, H);
  return {
    scale,
    setPage(p) { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, p); },
    setStatic(amount) { gl.uniform1f(u('staticAmt'), amount); gl.uniform1f(u('seed'), Math.random() * 1000); },
    draw() { gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); },
    destroy() { const ext = gl.getExtension('WEBGL_lose_context'); if (ext) ext.loseContext(); }
  };
}

// Copies the current page into the TV's picture.
function tvRender() {
  if (!tvPop || !tvPop.crt) return;
  tvPop.crt.setPage(paintPage(tvPop.pageSrc, tvPop.crt.scale));
  tvPop.crt.draw();
}
// Puts a show on screen, and redraws as its pictures finish loading.
function tvSetPage(show) {
  if (!tvPop) return;
  tvPop.pageSrc.innerHTML = buildShowPage(show);
  tvRender();
  tvPop.pageSrc.querySelectorAll('img').forEach(img => {
    if (img.complete) return;
    img.addEventListener('load', tvRender, { once: true });
    img.addEventListener('error', () => setTimeout(tvRender), { once: true });
  });
}

/* ---- Picture-button pop-up (the TV) ---- */

let tvPop = null;   // { btnImg, to, startT, anims, closing, frame, backdrop, close }

// The largest size that fits the window, centred.
function tvFinalRect(aspect) {
  const p = document.getElementById('page').getBoundingClientRect();
  const w = Math.min(p.width * 0.92, p.height * 0.86 * aspect);
  const h = w / aspect;
  return { left: (p.width - w) / 2, top: (p.height - h) / 2, width: w, height: h };
}

function openTvPop(btnEl, b) {
  if (tvPop && !tvPop.closing) return;
  const pop    = document.getElementById('tv-pop');
  const btnImg = btnEl.querySelector('img');

  // Re-opening while it's still shrinking back: grow again from where it has got to.
  if (tvPop && tvPop.closing) {
    tvPop.closing = false;
    pop.style.pointerEvents = '';
    animateTv(tvPop, true);
    return;
  }

  const from = btnImg.getBoundingClientRect();
  const to   = tvFinalRect(from.width / from.height);
  const sc   = b.screen;

  // Same shadow as the button, scaled up so it matches at the start of the motion.
  const z = to.width / from.width;
  const shadow = `drop-shadow(${-5*z}px ${3*z}px ${4*z}px rgba(0,0,0,0.24)) drop-shadow(${-10*z}px ${10*z}px ${16*z}px rgba(0,0,0,0.24))`;

  pop.innerHTML = `
    <div class="tv-backdrop"></div>
    <div class="tv-frame" style="left:${to.left}px; top:${to.top}px; width:${to.width}px;">
      <img src="${b.img}" alt="" draggable="false" style="filter:${shadow}">
      <div class="tv-screen" style="left:${sc.left*100}%; top:${sc.top*100}%; width:${sc.width*100}%; height:${sc.height*100}%;">
        <div class="tv-black"></div>
        <div class="tv-content">
          <div class="tv-page-src"></div>
          <canvas class="tv-gl" aria-hidden="true"></canvas>
        </div>
        <div class="tv-glass"></div>
      </div>
      ${b.prev ? `<button type="button" class="tv-ch" data-ch="-1" aria-label="Previous show" style="${pctBox(b.prev)}"></button>` : ''}
      ${b.next ? `<button type="button" class="tv-ch" data-ch="1" aria-label="Next show" style="${pctBox(b.next)}"></button>` : ''}
    </div>
    <button type="button" class="tv-close">close ×</button>`;
  pop.classList.add('open');
  btnImg.style.visibility = 'hidden';

  tvPop = { btnImg, to, startT: tvButtonTransform(btnImg, to), anims: [], powerAnims: [], closing: false,
            frame: pop.querySelector('.tv-frame'), backdrop: pop.querySelector('.tv-backdrop'), close: pop.querySelector('.tv-close'),
            content: pop.querySelector('.tv-content'), glass: pop.querySelector('.tv-glass'), black: pop.querySelector('.tv-black'),
            pageSrc: pop.querySelector('.tv-page-src'),
            crt: makeCrt(pop.querySelector('.tv-gl'), pop.querySelector('.tv-screen')) };
  tvSetPage(tvShows && tvShows[tvChannel]);
  animateTv(tvPop, true, true);
}

// Switching the picture on (a bright line that opens up) or off (it collapses to a line, then a dot).
// Starts from whatever state the picture is in, so it can be interrupted.
function tvPower(state, on, delay) {
  const cs = getComputedStyle(state.content);
  const now = { transform: cs.transform === 'none' ? 'scale(1, 1)' : cs.transform, opacity: +cs.opacity, filter: cs.filter === 'none' ? 'brightness(1)' : cs.filter };
  const glassNow = +getComputedStyle(state.glass).opacity;
  const blackNow = +getComputedStyle(state.black).opacity;
  state.powerAnims.forEach(a => a.cancel());
  if (reduceMotion.matches) {
    state.content.style.opacity = state.glass.style.opacity = state.black.style.opacity = on ? '1' : '0';
    state.powerAnims = [];
    return;
  }
  const line = 'scale(1, 0.006)';
  const frames = on
    ? (now.opacity < 0.05
        ? [{ transform: 'scale(0.9, 0.006)', opacity: 0, filter: 'brightness(3)' },
           { transform: 'scale(0.9, 0.006)', opacity: 1, filter: 'brightness(3)', offset: 0.15 },
           { transform: 'scale(1, 1)', opacity: 1, filter: 'brightness(1.5)', offset: 0.6, easing: 'ease-out' },
           { transform: 'scale(1, 1)', opacity: 1, filter: 'brightness(1)' }]
        : [now, { transform: 'scale(1, 1)', opacity: 1, filter: 'brightness(1)' }])
    : [now,
       { transform: line, opacity: 1, filter: 'brightness(3)', offset: 0.55, easing: 'ease-in' },
       { transform: 'scale(0, 0.006)', opacity: 0, filter: 'brightness(3)' }];
  const d = on ? 460 : 260;
  state.powerAnims = [
    state.content.animate(frames, { duration: d, delay: delay || 0, fill: 'both', easing: on ? 'ease-out' : 'linear' }),
    state.glass.animate([{ opacity: glassNow }, { opacity: on ? 1 : 0 }],
      { duration: on ? d * 0.6 : d * 0.5, delay: delay || 0, fill: 'both' }),
    // The dead grey glass of the photo goes dark as the picture comes on (and back to grey when it's off),
    // so the curved-away corners read as black screen.
    state.black.animate(on
      ? [{ opacity: blackNow }, { opacity: 1, offset: 0.15 }, { opacity: 1 }]
      : [{ opacity: blackNow }, { opacity: blackNow, offset: 0.7 }, { opacity: 0 }],
      { duration: d, delay: delay || 0, fill: 'both' })
  ];
}

// The transform that shrinks the big TV down onto its button.
function tvButtonTransform(btnImg, to) {
  const p = document.getElementById('page').getBoundingClientRect();
  const r = btnImg.getBoundingClientRect();
  return `translate(${r.left - p.left - to.left}px, ${r.top - p.top - to.top}px) scale(${r.width / to.width})`;
}

// Grows (open) or shrinks (close) from wherever the TV currently is.
function animateTv(state, open, fresh) {
  const cur = el => getComputedStyle(el);
  const fromT  = fresh ? state.startT : cur(state.frame).transform;
  const fromBd = fresh ? 0 : +cur(state.backdrop).opacity;
  const fromCl = fresh ? 0 : +cur(state.close).opacity;
  state.anims.forEach(a => a.cancel());
  const quick = reduceMotion.matches;
  const d = quick ? 0 : (open ? 560 : 420);
  state.anims = [
    state.frame.animate([{ transform: fromT }, { transform: open ? 'none' : state.startT }],
      { duration: d, easing: open ? 'cubic-bezier(0.22, 1, 0.36, 1)' : 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' }),
    state.backdrop.animate([{ opacity: fromBd }, { opacity: open ? 1 : 0 }],
      { duration: open ? d * 0.65 : d, easing: 'ease-out', fill: 'forwards' }),
    state.close.animate(open
      ? [{ opacity: fromCl }, { opacity: fromCl, offset: 0.6 }, { opacity: 1 }]
      : [{ opacity: fromCl }, { opacity: 0, offset: 0.3 }, { opacity: 0 }], { duration: d, fill: 'forwards' })
  ];
  // The picture comes on as the TV settles into place, and goes off as it starts to shrink.
  tvPower(state, open, open && fresh && !quick ? 380 : 0);
}

function closeTvPop() {
  if (!tvPop || tvPop.closing) return;
  const state = tvPop;
  state.closing = true;
  const pop = document.getElementById('tv-pop');
  pop.style.pointerEvents = 'none';
  state.startT = tvButtonTransform(state.btnImg, state.to);   // the button may have settled since it was clicked
  animateTv(state, false);
  state.anims[0].finished.then(() => {
    if (tvPop !== state || !state.closing) return;   // re-opened part-way
    pop.classList.remove('open');
    pop.style.pointerEvents = '';
    state.crt.destroy();   // frees the graphics context (browsers only allow a few at once)
    pop.innerHTML = '';
    state.btnImg.style.visibility = '';
    tvPop = null;
  }).catch(() => {});
}

function buildCards(s, catKey) {
  if (!catKey && s.buttons) return buildImageButtons(s);
  const examples = s.examples[catKey] || [];
  if (!examples.length) return '<div class="coming-soon">Coming Soon</div>';
  return examples.map((ex, i) => `
  <div class="card ${ex.compare ? 'card--open' : ''}" data-idx="${i}">
    ${buildCardImage(ex)}
    <div class="card-title">${ex.title}</div>
    <div class="card-desc">${ex.desc}</div>
    <div class="card-coords">${ex.coords}</div>
  </div>`).join('');
}

function onOverlayClick(e) {
  const back = e.target.closest('[data-action="back"]');
  const tab  = e.target.closest('.subj-tab');

  if (back) { closeSubject(); return; }

  const imgBtn = e.target.closest('.img-btn');
  if (imgBtn) {
    const b = subjects[currentSubjId].buttons.find(x => x.id === imgBtn.dataset.btn);
    if (b && b.screen) openTvPop(imgBtn, b);
    return;
  }

  const card = e.target.closest('.card--open');
  if (card) {
    openCompare(subjects[currentSubjId].examples[currentCat][card.dataset.idx]);
    return;
  }

  if (tab) {
    const key = tab.dataset.cat;
    if (key === currentCat) return;
    currentCat = key;

    document.querySelectorAll('.subj-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const hdrBg = document.querySelector('.subj-hdr-bg');
    hdrBg.style.background = headerBg(subjects[currentSubjId], key);
    hdrBg.style.filter     = headerFilter(subjects[currentSubjId], key);

    const grid = document.getElementById('cards-grid');
    grid.style.opacity = '0';

    // update cat label
    const label = document.querySelector('.cat-label');
    if (label) label.textContent = key;

    setTimeout(() => {
      grid.innerHTML = buildCards(subjects[currentSubjId], key);
      grid.style.opacity = '1';
    }, 140);
  }
}

function closeSubject() {
  if (!isSubjectOpen) return;
  isSubjectOpen = false;

  const token   = ++animToken;
  const overlay = document.getElementById('subj-overlay');
  const boxEl   = document.querySelector(`.subj-box[data-subject="${currentSubjId}"]`);
  overlay.removeEventListener('click', onOverlayClick);
  overlay.style.pointerEvents = 'none';

  // If the open sequence is still running, carry on from wherever it has got to.
  const s     = subjects[currentSubjId];
  const live  = liveState();
  const page  = pageState();
  const from  = live || page;
  const startOpacity = getComputedStyle(overlay).opacity;
  stopOverlayAnims();
  overlay.style.opacity = startOpacity;
  overlay.querySelector('.subj-name').style.visibility = 'hidden';
  makeBoxClone(boxEl, s, currentCat);
  makeTitleFly(s, page.title.r);
  const hold = animateClone(from, from, 0, 'linear');   // copy and title sit still under the fading page

  const quick = reduceMotion.matches;
  const fade = overlay.animate([{ opacity: startOpacity }, { opacity: 0 }],
    { duration: quick ? 0 : FADE_MS, easing: 'ease-in', fill: 'forwards' });
  overlayAnims = [...hold, fade];

  fade.finished.then(() => {
    if (token !== animToken) return;
    overlay.style.display = 'none';
    const shrink = animateClone(from, homeState(boxEl), quick ? 0 : SHRINK_MS, 'cubic-bezier(0.4, 0, 0.2, 1)');
    overlayAnims.push(...shrink);
    return shrink[0].finished;
  }).then(() => {
    if (token !== animToken) return;
    stopOverlayAnims();
    removeBoxClone();
    currentSubjId = null;
    currentCat    = null;
  }).catch(() => {});
}

/* ===================== BEFORE / AFTER POP-UP ===================== */

function buildCompareLayer(side, img, focus) {
  const inner = `<img src="${img.src}" alt="${img.label}" draggable="false" style="object-position:${focus || '50% 50%'};">`;
  return `<div class="cmp-layer cmp-layer--${side}">${inner}<div class="cmp-tag cmp-tag--${side}">${img.label}</div></div>`;
}

const WAYBACK_TILES = 'https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0/default028mm/MapServer/tile/{release}/{z}/{y}/{x}';

let cmpMap = null;

function destroyCompareMap() {
  if (cmpMap) { cmpMap.remove(); cmpMap = null; }
}

// Returns a function that moves the before/after divider to a given percentage.
function initCompareMap(c) {
  const el = document.getElementById('cmp-map');
  if (!window.L) {
    el.textContent = 'Map could not load — check your connection';
    return null;
  }

  const map = L.map(el, {
    center: c.map.center,
    zoom: c.map.zoom,
    minZoom: c.map.minZoom ?? 11,
    maxZoom: c.map.maxZoom ?? 18,
    maxBounds: c.map.bounds,
    maxBoundsViscosity: 1,
    zoomControl: false,
    attributionControl: false
  });
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  L.control.attribution({ position: 'bottomright', prefix: false }).addTo(map);

  const pane = map.createPane('before');
  pane.style.zIndex = 250;

  const attribution = 'Imagery © Esri, Maxar, Vantor · World Imagery Wayback';
  L.tileLayer(WAYBACK_TILES, { release: c.after.release, maxZoom: 18, attribution }).addTo(map);
  L.tileLayer(WAYBACK_TILES, { release: c.before.release, maxZoom: 18, pane: 'before' }).addTo(map);

  let pct = 50;
  const clip = () => {
    const size = map.getSize();
    const a = map.containerPointToLayerPoint([0, 0]);
    const b = map.containerPointToLayerPoint([size.x * pct / 100, size.y]);
    pane.style.clipPath = `polygon(${a.x}px ${a.y}px, ${b.x}px ${a.y}px, ${b.x}px ${b.y}px, ${a.x}px ${b.y}px)`;
  };
  map.on('move zoomend viewreset resize', clip);
  clip();

  cmpMap = map;
  return p => { pct = p; clip(); };
}

function openCompare(ex) {
  const s   = subjects[currentSubjId];
  const c   = ex.compare;
  const pop = document.getElementById('cmp-pop');

  destroyCompareMap();

  const layers = c.map
    ? `<div class="cmp-map" id="cmp-map"></div>
       <div class="cmp-tag cmp-tag--before">${c.before.label}</div>
       <div class="cmp-tag cmp-tag--after">${c.after.label}</div>`
    : buildCompareLayer('after', c.after, c.focus) + buildCompareLayer('before', c.before, c.focus);

  pop.innerHTML = `
  <div class="cmp-panel">
    <div class="cmp-head">
      <div>
        <div class="cmp-kicker">${s.label} · ${currentCat}</div>
        <div class="cmp-title">${ex.title}</div>
      </div>
      <div class="cmp-close" data-action="cmp-close">close ×</div>
    </div>
    <div class="cmp-stage ${c.map ? 'cmp-stage--map' : ''}" id="cmp-stage" ${c.aspect ? `style="height:auto; aspect-ratio:${c.aspect}; max-height:68vh;"` : ''}>
      ${layers}
      <div class="cmp-bar" tabindex="0" role="slider" aria-label="Before and after divider"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><div class="cmp-knob">◂ ▸</div></div>
    </div>
    <div class="cmp-foot">
      <p class="cmp-desc">${ex.desc}</p>
      <div class="cmp-meta"><span>${ex.coords}${c.credit ? ' · ' + c.credit : ''}</span><span>${c.map ? 'drag the bar to compare · scroll to zoom · drag the map to move' : 'drag the bar to compare'}</span></div>
    </div>
  </div>`;

  const stage = document.getElementById('cmp-stage');
  const bar   = stage.querySelector('.cmp-bar');
  if (c.map) initCompareBar(stage, bar, initCompareMap(c));
  else       initCompareBar(stage, stage, null);

  pop.classList.add('open');
}

function closeCompare() {
  const pop = document.getElementById('cmp-pop');
  pop.classList.remove('open');
  setTimeout(() => { if (!pop.classList.contains('open')) destroyCompareMap(); }, 250);
}

// grabEl is what the pointer drags: the whole stage for static images, only the bar over a map.
function initCompareBar(stage, grabEl, onChange) {
  const bar = stage.querySelector('.cmp-bar');
  const setPos = pct => {
    pct = Math.max(0, Math.min(100, pct));
    stage.style.setProperty('--pos', pct + '%');
    bar.setAttribute('aria-valuenow', Math.round(pct));
    if (onChange) onChange(pct);
  };
  const setFromPointer = e => {
    const r = stage.getBoundingClientRect();
    setPos((e.clientX - r.left) / r.width * 100);
  };

  grabEl.addEventListener('pointerdown', e => {
    grabEl.setPointerCapture(e.pointerId);
    bar.focus({ preventScroll: true });
    setFromPointer(e);
    e.preventDefault();
  });
  grabEl.addEventListener('pointermove', e => {
    if (grabEl.hasPointerCapture(e.pointerId)) setFromPointer(e);
  });
  bar.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const cur = parseFloat(stage.style.getPropertyValue('--pos')) || 50;
    setPos(cur + (e.key === 'ArrowLeft' ? -5 : 5));
  });
}

/* ===================== HELPERS ===================== */

function getBoxPos(boxEl) {
  const page    = document.getElementById('page');
  const pageR   = page.getBoundingClientRect();
  const boxR    = boxEl.getBoundingClientRect();

  return {
    top:    boxR.top  - pageR.top,
    left:   boxR.left - pageR.left,
    width:  boxR.width,
    height: boxR.height
  };
}

/* ===================== INIT ===================== */

document.addEventListener('DOMContentLoaded', () => {
  renderHome();
  window.addEventListener('resize', sizeSubjectHeader);

  // Fetch the tab header photos as soon as the home page is in, so they're ready before
  // a box is clicked rather than loading during the opening animation.
  window.addEventListener('load', () => {
    Object.values(subjects).forEach(s => {
      Object.values(s.catBackgrounds || {}).forEach(b => { if (b.src) new Image().src = b.src; });
    });
  });

  const pop = document.getElementById('cmp-pop');
  pop.addEventListener('click', e => {
    if (e.target === pop || e.target.closest('[data-action="cmp-close"]')) closeCompare();
  });

  loadShows();
  document.fonts.ready.then(tvRender);   // redraw the TV if it opened before the fonts arrived

  // Clicking outside the TV, or "close", shrinks it back into its button. Channels 1 / 12 change show.
  document.getElementById('tv-pop').addEventListener('click', e => {
    const ch = e.target.closest('.tv-ch');
    if (ch) { changeChannel(+ch.dataset.ch); return; }
    if (!e.target.closest('.tv-frame') || e.target.closest('.tv-close')) closeTvPop();
  });

  document.addEventListener('keydown', e => {
    if (tvPop && !tvPop.closing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      changeChannel(e.key === 'ArrowRight' ? 1 : -1);
      return;
    }
    if (e.key !== 'Escape') return;
    if (tvPop) closeTvPop();
    else if (pop.classList.contains('open')) closeCompare();
    else if (currentSubjId) closeSubject();
  });
});
